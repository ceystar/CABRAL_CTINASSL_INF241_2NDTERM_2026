
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Sumbong | Report and track community issues</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN / REGISTER -->
<section id="login">
  <div class="auth-card">

    <div class="auth-logo">
      <a class="logo">
        <span class="e">E</span>
        <span class="rest">
          <span>-SUM</span>
          <span>BONG</span>
        </span>
      </a>
    </div>

    <h1 id="authTitle">Welcome back</h1>

    <p class="auth-sub" id="authSub">
      Sign in to report and track community issues.
    </p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabIn"
        aria-selected="true" data-auth="in">Sign in</button>

      <button type="button" role="tab" id="tabUp"
        aria-selected="false" data-auth="up">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>

      <label class="show">
        <input type="checkbox" data-show="#password">
        Show password
      </label>

      <div class="err" id="loginErr" role="alert"></div>

      <button type="submit" class="btn big full">Sign in</button>

      <button type="button" class="linkbtn" id="forgotBtn">
        Forgot password?
      </button>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden" novalidate>
      <div class="field">
        <label for="regUser">Username</label>
        <input id="regUser" autocomplete="username">
      </div>

      <div class="field">
        <label for="regPass">Password</label>
        <input id="regPass" type="password" autocomplete="new-password">
        <div class="help">At least 4 characters.</div>
      </div>

      <div class="field">
        <label for="regPass2">Confirm password</label>
        <input id="regPass2" type="password" autocomplete="new-password">
      </div>

      <label class="show">
        <input type="checkbox" data-show="#regPass,#regPass2">
        Show passwords
      </label>

      <div class="err" id="regErr" role="alert"></div>

      <button type="submit" class="btn big full">
        Create account
      </button>
    </form>

    <p class="auth-foot">
      By continuing you agree to the
      <button type="button" class="linkbtn" id="termsBtn">
        Terms &amp; Conditions
      </button>
    </p>

  </div>
</section>

<!-- FRONTEND AUTHENTICATION -->
<script>
const $ = s => document.querySelector(s);
</script>

<script src="auth.js"></script>

</body>
</html>
